<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Syllable Sprout — Syllable Counting</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3d8a28;overflow:hidden;font-family:'Press Start 2P',monospace;
  user-select:none;-webkit-user-select:none;height:100vh;width:100vw}

.screen{position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(180deg,#89d4f5 0%,#a8e2f8 20%,#6cc14c 35%,#5aac3a 50%,#4a9830 100%)}
.screen.off{display:none}

.eyebrow{font-size:8px;letter-spacing:4px;color:#fff;text-transform:uppercase;margin-bottom:14px;
  text-shadow:1px 1px 0 rgba(0,0,0,0.3)}
.big-title{font-size:clamp(26px,7vw,46px);color:#fff;text-align:center;line-height:1.3;
  text-shadow:3px 3px 0 #2d6a1e;margin-bottom:28px}

.btn{background:linear-gradient(180deg,#ff6b6b 0%,#ee5a24 100%);color:#fff;
  border:4px solid #b33a1a;padding:14px 36px;font-size:12px;
  font-family:'Press Start 2P',monospace;border-radius:4px;cursor:pointer;letter-spacing:2px;
  text-transform:uppercase;
  box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2);
  transition:transform .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(0.96)!important}

.btn-glow{font-size:16px;padding:18px 48px;animation:btn-glow 1.8s ease-in-out infinite}
@keyframes btn-glow{
  0%,100%{transform:scale(1);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 20px rgba(255,107,107,0.3)}
  50%{transform:scale(1.08);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 50px rgba(255,107,107,0.6),0 0 80px rgba(238,90,36,0.3)}}

/* Game */
#s-game{justify-content:space-between;padding:clamp(14px,4vw,24px) 20px clamp(24px,5vw,36px)}
.hud{display:flex;flex-direction:column;align-items:center;gap:6px}
.round-dots{display:flex;gap:10px}
.rdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);
  border:2px solid rgba(255,255,255,0.4);transition:all .4s}
.rdot.done{background:#7cfc00;border-color:#2a5020}
.rdot.cur{background:#ffe44d;border-color:#cc8800}
.round-label{font-size:7px;letter-spacing:3px;color:#fff;text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}

#prompt{font-size:clamp(11px,2.8vw,14px);color:#fff;text-align:center;
  line-height:2.4;word-spacing:0.15em;
  background:rgba(42,30,15,0.9);border:4px solid #5a3e1b;border-radius:8px;
  padding:clamp(10px,2.5vw,14px) clamp(14px,3.5vw,20px);
  box-shadow:4px 4px 0 rgba(0,0,0,0.25);text-shadow:1px 1px 0 #000;
  min-height:40px;transition:opacity .3s}
#prompt strong{color:#ffe44d}

#game-area{display:flex;flex-direction:column;align-items:center;gap:16px}

#word-display{font-size:clamp(18px,4.5vw,26px);color:#fff;text-align:center;
  text-shadow:3px 3px 0 rgba(0,0,0,0.3);min-height:40px;padding:8px 20px;
  background:rgba(42,30,15,0.7);border:3px solid #5a3e1b;border-radius:8px;
  letter-spacing:0.1em;transition:opacity .3s}

.flower-canvas{border-radius:50%;touch-action:none}

#number-row{display:flex;gap:clamp(8px,2.5vw,14px);justify-content:center}
.num-btn{
  width:clamp(48px,11vw,64px);height:clamp(48px,11vw,64px);
  border-radius:50%;border:4px solid #c0392b;
  background:linear-gradient(135deg,#ff7e4e 0%,#e74c3c 100%);
  color:#fff;font-size:clamp(16px,4vw,22px);font-family:'Press Start 2P',monospace;
  cursor:pointer;
  box-shadow:inset -3px -3px 0 #a03020,inset 3px 3px 0 #ff9a7a,4px 4px 0 rgba(0,0,0,0.2);
  text-shadow:2px 2px 0 rgba(0,0,0,0.3);transition:transform .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center}
.num-btn:active{transform:scale(0.9)}
.num-btn.correct{background:linear-gradient(135deg,#7cfc00 0%,#32cd32 100%);
  border-color:#1a5010;
  box-shadow:inset -3px -3px 0 #1a5010,inset 3px 3px 0 #a0ff60,4px 4px 0 rgba(0,0,0,0.2)}
.num-btn.wrong{animation:btn-shake 0.4s ease-out}
@keyframes btn-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Win */
.win-screen{background:linear-gradient(180deg,#89d4f5 0%,#ffe44d 60%,#ffaa00 100%)!important}
.win-title{font-size:clamp(28px,8vw,50px);color:#fff;
  text-shadow:4px 4px 0 #2d6a1e;margin-bottom:12px;text-align:center}
.win-sub{font-size:clamp(9px,2.2vw,11px);color:#fff;text-align:center;
  max-width:300px;line-height:2.2;word-spacing:0.15em;margin-bottom:24px;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}
.badge{background:#fff;border:4px solid #5a3e1b;border-radius:12px;
  padding:16px 28px;margin-bottom:28px;text-align:center;
  box-shadow:4px 4px 0 rgba(0,0,0,0.15)}
.badge-label{font-size:7px;letter-spacing:3px;color:#5a3e1b;text-transform:uppercase}
.badge-name{font-size:12px;color:#2d6a1e;margin-top:8px}
</style>
</head>
<body>

<!-- Landing -->
<div class="screen" id="s-landing">
  <p class="eyebrow">Phonological Awareness</p>
  <h1 class="big-title">Syllable<br>Sprout</h1>
  <button class="btn btn-glow" id="startBtn">Begin</button>
</div>

<!-- Game -->
<div class="screen off" id="s-game">
  <div class="hud">
    <div class="round-dots" id="round-dots"></div>
    <div class="round-label" id="round-label"></div>
  </div>
  <div id="prompt"></div>
  <div id="game-area">
    <canvas id="game-canvas" class="flower-canvas" width="240" height="240"></canvas>
    <div id="word-display"></div>
    <div id="number-row">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
    </div>
  </div>
  <div></div>
</div>

<!-- Win -->
<div class="screen off win-screen" id="s-win">
  <p class="eyebrow">Quest Complete</p>
  <div class="win-title">Well Done!</div>
  <p class="win-sub">You counted every syllable!</p>
  <div class="badge">
    <div class="badge-label">Skill Unlocked</div>
    <div class="badge-name">Syllable Counting</div>
  </div>
  <button class="btn" id="playAgainBtn">Play Again</button>
</div>

<script>
'use strict';

// ═══ Data ═══
const ROUNDS=[
  {word:'apple',    syllables:['ap','ple'],           count:2},
  {word:'pencil',   syllables:['pen','cil'],          count:2},
  {word:'butterfly',syllables:['but','ter','fly'],    count:3},
  {word:'cat',      syllables:['cat'],                count:1},
  {word:'invisible',syllables:['in','vis','i','ble'], count:4},
  {word:'garden',   syllables:['gar','den'],          count:2},
];
let rIdx=0,hintTier=0,locked=false,canAnswer=false;

// ═══ Screens ═══
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('off'));
  document.getElementById(id).classList.remove('off');
}

// ═══ Speech ═══
let cv=null;
function cacheV(){const v=speechSynthesis.getVoices();if(!v.length)return;
  const p=['samantha','karen','moira','tessa','fiona','victoria','zira','jenny','google uk english female','google us english'];
  for(const n of p){const f=v.find(x=>x.name.toLowerCase().includes(n)&&x.lang.startsWith('en'));if(f){cv=f;return;}}
  cv=v.find(x=>x.lang.startsWith('en')&&x.localService)||v.find(x=>x.lang.startsWith('en'))||v[0];}
speechSynthesis.onvoiceschanged=cacheV;cacheV();

function say(t,cb){
  if(!t){if(cb)cb();return;}
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.rate=0.85;u.pitch=1.05;u.volume=1;
    if(!cv)cacheV();if(cv)u.voice=cv;let d=false;
    function fin(){if(d)return;d=true;if(cb)cb();}
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3000,t.length*200));
    speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume();},60);
}
function saySyllables(syls,onPetal,onDone){
  let i=0;
  function next(){if(i>=syls.length){if(onDone)onDone();return;}
    if(onPetal)onPetal(i);
    say(syls[i],()=>{i++;setTimeout(next,250);});}
  next();
}
setInterval(()=>{if(speechSynthesis.paused)speechSynthesis.resume();},500);

// ═══ SFX ═══
let _ac;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sfxOk(){try{const a=getAC(),n=a.currentTime;[523,659,784,1047].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.18,n+i*0.1+0.03);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.8);o.connect(g);g.connect(a.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.85);});}catch(e){}}
function sfxNo(){try{const a=getAC(),n=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(280,n);o.frequency.linearRampToValueAtTime(200,n+0.2);g.gain.setValueAtTime(0.1,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.25);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+0.3);}catch(e){}}
function sfxPetal(idx){try{const a=getAC(),n=a.currentTime;const notes=[440,523,659,784,880];const hz=notes[Math.min(idx,notes.length-1)];const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(0.15,n+0.03);g.gain.exponentialRampToValueAtTime(0.001,n+0.4);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+0.5);}catch(e){}}
function sfxWin(){try{const a=getAC(),n=a.currentTime;[523,587,659,784,880,1047].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.1,n+i*0.1+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.7);o.connect(g);g.connect(a.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.8);});}catch(e){}}
document.addEventListener('pointerdown',()=>{try{getAC();}catch(e){}},{once:true});

// ═══ Flower Drawing ═══
function drawPetal(ctx,len,width,color){
  // Teardrop petal shape using bezier curves
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-width*0.6,-len*0.35, -width*0.5,-len*0.75, 0,-len);
  ctx.bezierCurveTo(width*0.5,-len*0.75, width*0.6,-len*0.35, 0,0);
  ctx.closePath();
  // Gradient fill
  const g=ctx.createLinearGradient(0,0,0,-len);
  g.addColorStop(0,color);
  g.addColorStop(0.5,color);
  g.addColorStop(1,lightenColor(color,40));
  ctx.fillStyle=g;ctx.fill();
  // Vein line
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,-len*0.15);ctx.lineTo(0,-len*0.85);ctx.stroke();
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.ellipse(-width*0.15,-len*0.5,width*0.15,len*0.25,0,0,Math.PI*2);
  ctx.fill();
}

function lightenColor(hex,amt){
  // Simple hex lighten
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);
  return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
}

function drawFlower(ctx,cx,cy,size,totalPetals,bloomCount,color){
  // Stem with slight curve
  ctx.save();
  ctx.strokeStyle='#2d8a4e';ctx.lineWidth=size*0.07;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy+size*0.35);
  ctx.bezierCurveTo(cx+size*0.08,cy+size*0.6, cx-size*0.04,cy+size*0.85, cx,cy+size*1.1);
  ctx.stroke();
  // Two leaves
  ctx.fillStyle='#4a9830';
  ctx.save();ctx.translate(cx-size*0.05,cy+size*0.7);ctx.rotate(-0.5);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(-size*0.15,-size*0.08,-size*0.2,-size*0.02,0,0);
  ctx.bezierCurveTo(-size*0.18,-size*0.14,-size*0.12,-size*0.12,0,0);
  ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle='#5aac3a';
  ctx.save();ctx.translate(cx+size*0.06,cy+size*0.55);ctx.rotate(0.4);
  ctx.beginPath();ctx.ellipse(size*0.12,0,size*0.14,size*0.06,0.2,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Only draw bloomed petals — no placeholders for un-bloomed ones
  const petalLen=size*0.38, petalWidth=size*0.2;
  // Use 8 evenly spaced slots for visual balance regardless of count
  const slots=8;
  // Map bloomed petals to evenly distributed positions
  for(let i=0;i<bloomCount;i++){
    const ang=(i/Math.max(bloomCount,1))*Math.PI*2 - Math.PI/2;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(ang);
    ctx.translate(0,-size*0.08);
    drawPetal(ctx,petalLen,petalWidth,color||'#fd79a8');
    ctx.restore();
  }

  // Center — always visible
  const cg=ctx.createRadialGradient(cx-size*0.04,cy-size*0.04,0,cx,cy,size*0.2);
  cg.addColorStop(0,'#fff8c0');cg.addColorStop(0.5,'#ffe44d');cg.addColorStop(1,'#fdb347');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(cx,cy,size*0.18,0,Math.PI*2);ctx.fill();
  // Center texture dots
  ctx.fillStyle='rgba(200,140,40,0.3)';
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2,d=size*0.08;
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,size*0.025,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawScene(ctx,w,h,totalPetals,bloomCount,color){
  ctx.clearRect(0,0,w,h);
  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#a8e2f8');bg.addColorStop(0.5,'#72c84e');bg.addColorStop(1,'#3d8a28');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(w/2,h/2,w/2-4,0,Math.PI*2);ctx.fill();
  drawFlower(ctx,w/2,h*0.4,w*0.35,totalPetals,bloomCount,color);
}

// ═══ Game ═══
const gameCanvas=document.getElementById('game-canvas');
const gameCtx=gameCanvas.getContext('2d');
const wordEl=document.getElementById('word-display');
const promptEl=document.getElementById('prompt');
const numBtns=document.querySelectorAll('.num-btn');

function startGame(){
  try{getAC();}catch(e){}
  speechSynthesis.cancel();
  rIdx=0;showScreen('s-game');setTimeout(()=>setupRound(0),200);
}

function setupRound(idx){
  const r=ROUNDS[idx];locked=false;hintTier=0;canAnswer=false;

  document.getElementById('round-dots').innerHTML=ROUNDS.map((_,i)=>
    `<div class="rdot${i<idx?' done':''}${i===idx?' cur':''}"></div>`).join('');
  document.getElementById('round-label').textContent=`Round ${idx+1} of ${ROUNDS.length}`;

  numBtns.forEach(b=>b.className='num-btn');
  drawScene(gameCtx,240,240,r.count,0,'#fd79a8');
  wordEl.textContent=r.word.toUpperCase();
  promptEl.innerHTML='Listen to the word, then tap the number of syllables.';

  const instruction=idx===0
    ?'Listen to the word, then tap the number of syllables.'
    :'';

  function afterInstruction(){
    say(r.word,()=>{
      saySyllables(r.syllables,(i)=>{
        sfxPetal(i);
        drawScene(gameCtx,240,240,r.count,i+1,'#fd79a8');
      },()=>{
        drawScene(gameCtx,240,240,r.count,0,'#fd79a8');
        promptEl.innerHTML='How many syllables? Tap the number!';
        say('How many syllables?',()=>{canAnswer=true;});
      });
    });
  }

  if(instruction){
    say(instruction,()=>setTimeout(afterInstruction,200));
  } else {
    setTimeout(afterInstruction,300);
  }
}

function checkAnswer(num){
  if(!canAnswer||locked)return;
  locked=true;
  const r=ROUNDS[rIdx];

  if(num===r.count){
    const btn=document.querySelector(`.num-btn[data-num="${num}"]`);
    if(btn)btn.classList.add('correct');
    sfxOk();
    let b=0;
    const bInt=setInterval(()=>{b++;drawScene(gameCtx,240,240,r.count,b,'#fd79a8');if(b>=r.count)clearInterval(bInt);},150);
    promptEl.innerHTML=`<strong>${r.word}</strong> has <strong>${r.count}</strong> syllables!`;
    say(`${r.word} has ${r.count} syllables!`,()=>{setTimeout(advanceRound,600);});
  } else {
    hintTier++;sfxNo();
    const btn=document.querySelector(`.num-btn[data-num="${num}"]`);
    if(btn)btn.classList.add('wrong');
    setTimeout(()=>{if(btn)btn.classList.remove('wrong');},500);

    if(hintTier<3){
      promptEl.innerHTML='Not quite! Listen again and count each part.';
      say('Not quite! Listen again.',()=>{
        saySyllables(r.syllables,(i)=>{
          sfxPetal(i);
          drawScene(gameCtx,240,240,r.count,i+1,'#fd79a8');
        },()=>{
          drawScene(gameCtx,240,240,r.count,0,'#fd79a8');
          promptEl.innerHTML='How many syllables?';
          locked=false;
        });
      });
    } else {
      const correctBtn=document.querySelector(`.num-btn[data-num="${r.count}"]`);
      if(correctBtn)correctBtn.classList.add('correct');
      promptEl.innerHTML=`The answer is <strong>${r.count}</strong>. ${r.syllables.join(' · ')}.`;
      say(`The answer is ${r.count}. ${r.syllables.join(', ')}.`,()=>{
        sfxOk();
        let b=0;
        const bInt=setInterval(()=>{b++;drawScene(gameCtx,240,240,r.count,b,'#fd79a8');if(b>=r.count)clearInterval(bInt);},150);
        setTimeout(advanceRound,1500);
      });
    }
  }
}

function advanceRound(){
  rIdx++;
  if(rIdx>=ROUNDS.length){sfxWin();showScreen('s-win');burstWin();}
  else setupRound(rIdx);
}

numBtns.forEach(btn=>{
  btn.addEventListener('click',e=>{e.preventDefault();checkAnswer(parseInt(btn.dataset.num));});
});

// ═══ Win Particles ═══
function burstWin(){
  const c=document.createElement('canvas');c.width=innerWidth;c.height=innerHeight;
  c.style.cssText='position:fixed;top:0;left:0;z-index:100;pointer-events:none';
  document.body.appendChild(c);const cx=c.getContext('2d');const parts=[];
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;
    parts.push({x:c.width/2,y:c.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,
      r:Math.random()*4+2,color:`hsl(${Math.random()*360},80%,60%)`,alpha:1});}
  (function loop(){cx.clearRect(0,0,c.width,c.height);let alive=false;
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.alpha-=0.015;
      if(p.alpha>0){alive=true;cx.globalAlpha=p.alpha;cx.fillStyle=p.color;
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();}});
    cx.globalAlpha=1;if(alive)requestAnimationFrame(loop);else c.remove();})();
}

// ═══ Buttons ═══
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('playAgainBtn').addEventListener('click',startGame);
</script>
</body>
</html>
