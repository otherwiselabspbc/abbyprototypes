<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Block Breaker — Letter Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated}
body{background:#4a8ff5;overflow:hidden;font-family:'Press Start 2P',monospace;
  user-select:none;-webkit-user-select:none;touch-action:none;height:100vh;width:100vw}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

.screen{position:fixed;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.off{display:none!important}

/* Landing */
#s-title{background:linear-gradient(180deg,#4a8ff5 0%,#6ec6ff 40%,#a8e6a3 65%,#5cb85c 75%,#3a7d3a 100%)}
.eyebrow{font-size:8px;letter-spacing:4px;color:#fff;text-transform:uppercase;margin-bottom:14px;
  text-shadow:1px 1px 0 #2a6dd4}
.big-title{font-size:clamp(26px,7vw,46px);color:#fff;text-align:center;line-height:1.3;
  text-shadow:3px 3px 0 #2a5fb0;margin-bottom:12px}
.btn{background:linear-gradient(180deg,#ff6b6b 0%,#ee5a24 100%);color:#fff;
  border:4px solid #b33a1a;padding:14px 36px;font-size:12px;
  font-family:'Press Start 2P',monospace;border-radius:4px;cursor:pointer;letter-spacing:2px;
  text-transform:uppercase;
  box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2);
  transition:transform .1s}
.btn:hover{transform:scale(1.05)!important}
.btn:active{transform:scale(0.96)!important}

.btn-glow{
  animation:btn-glow-pulse 1.8s ease-in-out infinite;
  font-size:16px;padding:18px 48px}
@keyframes btn-glow-pulse{
  0%,100%{transform:scale(1);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 20px rgba(255,107,107,0.3)}
  50%{transform:scale(1.08);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 50px rgba(255,107,107,0.6),0 0 80px rgba(238,90,36,0.3)}}
.skill-tag{position:absolute;bottom:20px;font-size:7px;letter-spacing:2px;
  color:rgba(255,255,255,0.6);text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,0.2)}

/* Game */
#s-game{background:linear-gradient(180deg,#4a8ff5 0%,#6ec6ff 40%,#a8e6a3 65%,#5cb85c 75%,#3a7d3a 100%);
  justify-content:space-between;padding:clamp(14px,4vw,24px) 20px clamp(24px,5vw,36px)}

#hud-top{display:flex;flex-direction:column;align-items:center;gap:6px}
#round-dots{display:flex;gap:10px}
.rdot{width:10px;height:10px;border-radius:2px;background:#2a5fb0;
  border:2px solid #1a3f80;transition:all .4s}
.rdot.done{background:#7cfc00;border-color:#2a5020}
.rdot.cur{background:#ffe44d;border-color:#cc8800;box-shadow:0 0 8px rgba(255,228,77,0.6)}
#round-label{font-size:7px;letter-spacing:3px;color:#fff;text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}


#instruction{font-size:clamp(11px,2.8vw,14px);color:#fff;text-align:center;
  line-height:2.6;word-spacing:0.15em;
  background:rgba(42,95,176,0.94);border:4px solid #1a3f80;border-radius:8px;
  padding:clamp(10px,2.5vw,16px) clamp(14px,3.5vw,20px);
  box-shadow:4px 4px 0 rgba(0,0,0,0.25);text-shadow:2px 2px 0 rgba(0,0,0,0.3);
  transition:opacity .35s;pointer-events:none;min-height:36px}
#instruction.fade{opacity:0}

#blocks-grid{display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(20px,6vw,36px);width:fit-content;margin:auto}

.block{
  width:clamp(108px,26vw,140px);height:clamp(108px,26vw,140px);
  border-radius:12px;border:5px solid #cc8800;
  background:linear-gradient(135deg,#ffe44d 0%,#ffaa00 50%,#e69500 100%);
  box-shadow:inset -4px -4px 0 #b38600,inset 4px 4px 0 #fff176,5px 5px 0 rgba(0,0,0,0.2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .2s,opacity .3s;
  opacity:0;transform:scale(0.7) translateY(20px)}
.block.show{opacity:1;transform:scale(1) translateY(0)}
.block.playing{transform:scale(1.18) translateY(-10px);
  border-color:#fff;
  background:linear-gradient(135deg,#fff8c0 0%,#ffe44d 50%,#ffaa00 100%);
  box-shadow:inset -4px -4px 0 #cc9900,inset 4px 4px 0 #fff,
    0 0 40px rgba(255,228,77,0.8),0 0 80px rgba(255,228,77,0.4),5px 5px 0 rgba(0,0,0,0.15);
  animation:block-pulse .4s ease-in-out infinite alternate}
.block.playing .block-letter{color:#2a1500;text-shadow:0 0 8px rgba(255,255,255,0.8)}
@keyframes block-pulse{
  0%{box-shadow:inset -4px -4px 0 #cc9900,inset 4px 4px 0 #fff,0 0 40px rgba(255,228,77,0.8),0 0 80px rgba(255,228,77,0.4),5px 5px 0 rgba(0,0,0,0.15)}
  100%{box-shadow:inset -4px -4px 0 #cc9900,inset 4px 4px 0 #fff,0 0 60px rgba(255,255,200,0.9),0 0 100px rgba(255,228,77,0.5),5px 5px 0 rgba(0,0,0,0.15)}}
.block.correct{
  background:linear-gradient(135deg,#7cfc00 0%,#32cd32 50%,#228b22 100%);
  border-color:#2a5020;
  box-shadow:inset -4px -4px 0 #1a4010,inset 4px 4px 0 #a0ff60,0 0 24px #7cfc00,5px 5px 0 rgba(0,0,0,0.2)}
.block.wrong{animation:block-shake .45s ease-out}
.block.smash{opacity:0!important;transform:scale(0)!important;transition:all 0.15s!important}
.block.celebrate{animation:block-celebrate .9s ease-out}
.block-letter{font-size:clamp(30px,7.5vw,44px);color:#5a3000;
  text-shadow:2px 2px 0 rgba(255,255,255,0.3);pointer-events:none;z-index:2}
.block.correct .block-letter{color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.3)}

@keyframes block-shake{
  0%,100%{transform:scale(1) translateX(0)}
  20%{transform:scale(1.02) translateX(-9px)}
  40%{transform:scale(1.02) translateX(9px)}
  60%{transform:scale(1.01) translateX(-6px)}
  80%{transform:scale(1.01) translateX(4px)}}
@keyframes block-celebrate{
  0%{transform:scale(1)}25%{transform:scale(1.15) translateY(-6px)}
  55%{transform:scale(0.95)}75%{transform:scale(1.08) translateY(-3px)}100%{transform:scale(1)}}

/* Overlays */
.ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(180deg,#4a8ff5 0%,#6ec6ff 40%,#ffe44d 70%,#ffaa00 100%);
  transition:opacity .4s}
.ov.off{opacity:0;pointer-events:none}
.ov h2{font-size:clamp(28px,8vw,50px);color:#fff;
  text-shadow:4px 4px 0 #cc8800;margin-bottom:12px;text-align:center}
.ov p{font-size:clamp(9px,2.2vw,11px);color:#fff;text-align:center;
  max-width:300px;line-height:2.2;word-spacing:0.15em;margin-bottom:28px;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}
.badge{background:#fff;border:4px solid #2a5fb0;border-radius:8px;
  padding:16px 28px;margin-bottom:32px;text-align:center;
  box-shadow:4px 4px 0 rgba(0,0,0,0.15)}
.badge-label{font-size:7px;letter-spacing:3px;color:#2a5fb0;text-transform:uppercase}
.badge-name{font-size:12px;color:#228b22;margin-top:8px}

#fail-ov{background:linear-gradient(180deg,#4a8ff5 0%,#6ec6ff 40%,rgba(232,116,97,0.3) 70%,#c0503e 100%)}
.btn-red{background:linear-gradient(180deg,#e87461,#c0503e);box-shadow:inset -3px -3px 0 #9a3a2a,inset 3px 3px 0 #ff9a8a,6px 6px 0 rgba(0,0,0,0.2);border-color:#9a3a2a}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:30"></canvas>

<!-- Landing -->
<div class="screen" id="s-title">
  <p class="eyebrow">Letter Knowledge</p>
  <h1 class="big-title">Block<br>Breaker</h1>
  <button class="btn btn-glow" id="startBtn">Begin</button>
  <p class="skill-tag">Letter Recognition · Ages 5–10</p>
</div>

<!-- Game -->
<div class="screen off" id="s-game">
  <div id="hud-top">
    <div id="round-dots"></div>
    <div id="round-label">Round 1 of 6</div>
  </div>
  <div id="instruction"></div>
  <div id="blocks-grid">
    <div class="block" id="block0"><span class="block-letter"></span></div>
    <div class="block" id="block1"><span class="block-letter"></span></div>
    <div class="block" id="block2"><span class="block-letter"></span></div>
    <div class="block" id="block3"><span class="block-letter"></span></div>
  </div>
  <div></div>
</div>

<!-- Win -->
<div class="ov off" id="win-ov">
  <h2>Well Done!</h2>
  <p>You know your letter names!</p>
  <div class="badge">
    <div class="badge-label">Skill Unlocked</div>
    <div class="badge-name">Letter Recognition</div>
  </div>
  <button class="btn" id="playAgainBtn">Play Again</button>
</div>

<!-- Fail -->
<div class="ov off" id="fail-ov">
  <h2>Time's Up</h2>
  <p>The blocks went quiet — try again!</p>
  <button class="btn btn-red" id="retryBtn">Retry</button>
</div>

<script>
'use strict';

const ROUNDS=[
  {letters:['B','G','T','R'], target:2},
  {letters:['A','E','N','K'], target:3},
  {letters:['D','P','M','F'], target:0},
  {letters:['S','L','W','H'], target:1},
  {letters:['C','J','Q','Z'], target:2},
  {letters:['Y','I','O','U'], target:0},
];
let rIdx=0,canAnswer=false,locked=false,hintTier=0;
const blockEls=[0,1,2,3].map(i=>document.getElementById('block'+i));

// ═══ Background particles ═══
const bgCanvas=document.getElementById('bgCanvas');
const bgCtx=bgCanvas.getContext('2d');
const particles=[];
function resizeBg(){bgCanvas.width=innerWidth;bgCanvas.height=innerHeight}
resizeBg();addEventListener('resize',resizeBg);
for(let i=0;i<55;i++){
  particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.3+0.4,vx:(Math.random()-0.5)*0.12,vy:-Math.random()*0.18-0.05,
    alpha:Math.random()*0.45+0.1,phase:Math.random()*Math.PI*2});
}
(function bgLoop(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.phase+=0.035;
    if(p.y<-4){p.y=bgCanvas.height+4;p.x=Math.random()*bgCanvas.width;}
    const a=p.alpha*(0.55+0.45*Math.sin(p.phase));
    bgCtx.beginPath();bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(255,255,255,${a})`;bgCtx.fill();
  });
  requestAnimationFrame(bgLoop);
})();

// ═══ Speech ═══
let cv=null;
function cacheV(){const v=speechSynthesis.getVoices();if(!v.length)return;
  const p=['samantha','karen','moira','tessa','fiona','victoria','zira','jenny','google uk english female','google us english'];
  for(const n of p){const f=v.find(x=>x.name.toLowerCase().includes(n)&&x.lang.startsWith('en'));if(f){cv=f;return;}}
  cv=v.find(x=>x.lang.startsWith('en')&&x.localService)||v.find(x=>x.lang.startsWith('en'))||v[0];}
speechSynthesis.onvoiceschanged=cacheV;cacheV();

function say(t,cb){
  if(!t){if(cb)cb();return;}
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.rate=0.92;u.pitch=1.1;u.volume=1;
    if(!cv)cacheV();if(cv)u.voice=cv;let d=false;
    function fin(){if(d)return;d=true;if(cb)cb();}
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3000,t.length*200));
    speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume();},60);
}

// Speak a letter name without "capital" prefix
function sayLetter(letter,cb){say(letter.toLowerCase(),cb);}

// ═══ SFX ═══
let _ac;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sfxOk(){try{const a=getAC(),n=a.currentTime;[523,659,784].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.08);g.gain.linearRampToValueAtTime(0.12,n+i*0.08+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.08+0.5);o.connect(g);g.connect(a.destination);o.start(n+i*0.08);o.stop(n+i*0.08+0.6);});}catch(e){}}
function sfxNo(){try{const a=getAC(),n=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(280,n);o.frequency.linearRampToValueAtTime(200,n+0.2);g.gain.setValueAtTime(0.1,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.25);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+0.3);}catch(e){}}
function sfxWin(){try{const a=getAC(),n=a.currentTime;[523,587,659,784,880,1047].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.1,n+i*0.1+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.7);o.connect(g);g.connect(a.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.8);});}catch(e){}}
document.addEventListener('pointerdown',()=>{try{getAC();}catch(e){}},{once:true});
setInterval(()=>{if(speechSynthesis.paused)speechSynthesis.resume();},500);

// ═══ Shatter FX ═══
const fxCanvas=document.getElementById('fxCanvas');
const fxCtx=fxCanvas.getContext('2d');
function resizeFx(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
resizeFx();addEventListener('resize',resizeFx);
let shards=[];
function shatter(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const colors=['#ffe44d','#ffaa00','#e69500','#fff176','#cc8800','#fff'];
  for(let i=0;i<28;i++){
    const ang=Math.random()*Math.PI*2,spd=Math.random()*8+3;
    const w=Math.random()*18+8,h=Math.random()*18+8;
    shards.push({x:cx+Math.random()*40-20,y:cy+Math.random()*40-20,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-4,
      w,h,rot:Math.random()*360,vr:Math.random()*15-7.5,
      alpha:1,color:colors[Math.floor(Math.random()*colors.length)]});
  }
  if(!shardAnimating){shardAnimating=true;shardLoop();}
}
let shardAnimating=false;
function shardLoop(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  shards.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.35;s.rot+=s.vr;s.alpha-=0.018;
    fxCtx.save();fxCtx.translate(s.x,s.y);fxCtx.rotate(s.rot*Math.PI/180);
    fxCtx.globalAlpha=Math.max(0,s.alpha);
    fxCtx.fillStyle=s.color;fxCtx.fillRect(-s.w/2,-s.h/2,s.w,s.h);
    fxCtx.restore();
  });
  shards=shards.filter(s=>s.alpha>0);
  if(shards.length>0)requestAnimationFrame(shardLoop);
  else{shardAnimating=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
}

// ═══ Screens ═══
function showScreen(id){
  document.querySelectorAll('.screen,.ov').forEach(s=>s.classList.add('off'));
  document.getElementById(id).classList.remove('off');
}

// ═══ Instruction ═══
const instrEl=document.getElementById('instruction');
function setInstr(txt){instrEl.classList.remove('fade');instrEl.innerHTML=txt;}
function fadeInstr(){instrEl.classList.add('fade');}

// ═══ Game ═══
function startGame(){
  try{getAC();}catch(e){}
  speechSynthesis.cancel();
  rIdx=0;showScreen('s-game');setTimeout(()=>setupRound(0),120);
}

function setupRound(idx){
  const r=ROUNDS[idx];locked=false;canAnswer=false;hintTier=0;

  // Dots
  document.getElementById('round-dots').innerHTML=ROUNDS.map((_,i)=>
    `<div class="rdot${i<idx?' done':''}${i===idx?' cur':''}"></div>`).join('');
  document.getElementById('round-label').textContent=`Round ${idx+1} of ${ROUNDS.length}`;

  // Set letters
  blockEls.forEach((el,i)=>{
    el.className='block';
    el.querySelector('.block-letter').textContent=r.letters[i];
    el.style.transition='none';el.style.opacity='0';el.style.transform='scale(0.7) translateY(20px)';
    setTimeout(()=>{
      el.style.transition='opacity 0.45s ease-out, transform 0.45s cubic-bezier(0.22,1,0.36,1), box-shadow .2s';
      el.style.opacity='1';el.style.transform='scale(1) translateY(0)';
    },60+i*110);
  });

  // Auto-play all letters, then ask
  const playDelay=60+4*110+200;
  if(idx===0){
    setInstr('Listen carefully to each letter.');
    say('Listen carefully to each letter.',()=>setTimeout(()=>autoPlayAll(r),200));
  } else {
    setInstr('Listen carefully…');
    setTimeout(()=>autoPlayAll(r),playDelay);
  }
}

function autoPlayAll(r){
  let i=0;
  function next(){
    if(i>=r.letters.length){
      // All played — speak the target letter name only (don't show it)
      setTimeout(()=>{
        const target=r.letters[r.target];
        setInstr("Which one is it? Tap it!");
        say(`Find ${target.toLowerCase()}.`,()=>{canAnswer=true;});
      },300);
      return;
    }
    blockEls[i].classList.add('playing');
    sayLetter(r.letters[i],()=>{blockEls[i].classList.remove('playing');i++;setTimeout(next,200);});
  }
  next();
}

// ═══ Block taps ═══
blockEls.forEach((el,i)=>{
  el.addEventListener('pointerdown',e=>{e.preventDefault();handleTap(i);});
});

function handleTap(i){
  if(locked||!canAnswer)return;
  locked=true;
  const r=ROUNDS[rIdx];
  const tapped=r.letters[i];
  const target=r.letters[r.target];

  if(i===r.target){
    sfxOk();
    blockEls[i].classList.add('correct');
    blockEls.forEach((el,j)=>{if(j!==i)el.classList.add('celebrate');});
    setInstr(`That's ${target}!`);
    say(`That's ${target.toLowerCase()}!`);
    setTimeout(()=>{
      shatter(blockEls[i]);
      blockEls[i].classList.add('smash');
      setTimeout(advanceRound,800);
    },1200);
  } else {
    hintTier++;sfxNo();
    blockEls[i].classList.add('wrong');

    if(hintTier<3){
      setInstr(`That's ${tapped}. Try again!`);
      say(`That's ${tapped.toLowerCase()}. Try again!`,()=>{
        blockEls[i].classList.remove('wrong');locked=false;
      });
    } else {
      // Bottom-out — reveal answer
      blockEls[i].classList.remove('wrong');
      blockEls[r.target].classList.add('correct');
      setInstr(`The answer is ${target}.`);
      say(`The answer is ${target.toLowerCase()}.`);
      sfxOk();
      setTimeout(()=>{
        shatter(blockEls[r.target]);
        blockEls[r.target].classList.add('smash');
        setTimeout(advanceRound,800);
      },1500);
    }
  }
}

function advanceRound(){
  rIdx++;
  if(rIdx>=ROUNDS.length){sfxWin();showScreen('win-ov');}
  else setupRound(rIdx);
}

// ═══ Buttons ═══
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('playAgainBtn').addEventListener('click',()=>{
  document.getElementById('win-ov').classList.add('off');rIdx=0;
  showScreen('s-game');setTimeout(()=>setupRound(0),120);
});
document.getElementById('retryBtn').addEventListener('click',()=>{
  document.getElementById('fail-ov').classList.add('off');rIdx=0;
  showScreen('s-game');setTimeout(()=>setupRound(0),120);
});
</script>
</body>
</html>
