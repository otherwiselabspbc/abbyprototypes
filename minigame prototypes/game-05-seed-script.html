<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Seed Script — Letter Tracing</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3d8a28;overflow:hidden;font-family:'Press Start 2P',monospace;
  user-select:none;-webkit-user-select:none;height:100vh;width:100vw;color:#fff}

.screen{position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(180deg,#89d4f5 0%,#a8e2f8 20%,#6cc14c 35%,#5aac3a 50%,#4a9830 100%)}
.screen.off{display:none}

.eyebrow{font-size:8px;letter-spacing:4px;color:#fff;text-transform:uppercase;margin-bottom:14px;
  text-shadow:1px 1px 0 rgba(0,0,0,0.3)}
.big-title{font-size:clamp(26px,7vw,46px);color:#fff;text-align:center;line-height:1.3;
  text-shadow:3px 3px 0 #2d6a1e;margin-bottom:28px}

.btn{background:linear-gradient(180deg,#ff6b6b 0%,#ee5a24 100%);color:#fff;
  border:4px solid #b33a1a;padding:14px 36px;font-size:12px;
  font-family:'Press Start 2P',monospace;border-radius:4px;cursor:pointer;letter-spacing:2px;
  text-transform:uppercase;
  box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2);
  transition:transform .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(0.96)!important}

.btn-glow{font-size:16px;padding:18px 48px;animation:btn-glow 1.8s ease-in-out infinite}
@keyframes btn-glow{
  0%,100%{transform:scale(1);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 20px rgba(255,107,107,0.3)}
  50%{transform:scale(1.08);box-shadow:inset -3px -3px 0 #b33a1a,inset 3px 3px 0 #ff9a7a,6px 6px 0 rgba(0,0,0,0.2),0 0 50px rgba(255,107,107,0.6),0 0 80px rgba(238,90,36,0.3)}}

/* Game */
.hud{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px}
.round-dots{display:flex;gap:10px}
.rdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);
  border:2px solid rgba(255,255,255,0.4);transition:all .4s}
.rdot.done{background:#7cfc00;border-color:#2a5020}
.rdot.cur{background:#ffe44d;border-color:#cc8800}
.round-label{font-size:7px;letter-spacing:3px;color:#fff;text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}

.caption-card{font-size:clamp(11px,2.8vw,14px);color:#fff;text-align:center;
  line-height:2.6;word-spacing:0.15em;
  background:rgba(42,30,15,0.9);border:4px solid #5a3e1b;border-radius:8px;
  padding:clamp(10px,2.5vw,14px) clamp(14px,3.5vw,20px);max-width:420px;
  box-shadow:4px 4px 0 rgba(0,0,0,0.25);text-shadow:1px 1px 0 #000;
  margin-bottom:16px;min-height:40px}
.caption-card strong{color:#ffe44d;padding:0 0.15em}

.trace-canvas{border-radius:16px;border:4px solid #5a3e1b;
  box-shadow:4px 4px 0 rgba(0,0,0,0.2);touch-action:none;position:relative;z-index:1;
  margin-bottom:16px;background:#5a3820}

/* Win */
.win-screen{background:linear-gradient(180deg,#89d4f5 0%,#ffe44d 60%,#ffaa00 100%)!important}
.win-title{font-size:clamp(28px,8vw,50px);color:#fff;
  text-shadow:4px 4px 0 #2d6a1e;margin-bottom:12px;text-align:center}
.win-sub{font-size:clamp(9px,2.2vw,11px);color:#fff;text-align:center;
  max-width:300px;line-height:2.2;word-spacing:0.15em;margin-bottom:24px;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2)}
.badge{background:#fff;border:4px solid #5a3e1b;border-radius:12px;
  padding:16px 28px;margin-bottom:28px;text-align:center;
  box-shadow:4px 4px 0 rgba(0,0,0,0.15)}
.badge-label{font-size:7px;letter-spacing:3px;color:#5a3e1b;text-transform:uppercase}
.badge-name{font-size:12px;color:#2d6a1e;margin-top:8px}
</style>
</head>
<body>

<!-- Landing -->
<div class="screen" id="s-landing">
  <p class="eyebrow">Letter Knowledge</p>
  <h1 class="big-title">Seed<br>Script</h1>
  <button class="btn btn-glow" id="startBtn">Begin</button>
</div>

<!-- Game -->
<div class="screen off" id="s-game">
  <div class="hud">
    <div class="round-dots" id="round-dots"></div>
    <div class="round-label" id="round-label"></div>
  </div>
  <div class="caption-card" id="caption">Trace the letter!</div>
  <canvas id="trace-canvas" class="trace-canvas" width="280" height="280"></canvas>
</div>

<!-- Win -->
<div class="screen off win-screen" id="s-win">
  <p class="eyebrow">Quest Complete</p>
  <div class="win-title">Well Done!</div>
  <p class="win-sub">You traced every letter!</p>
  <div class="badge">
    <div class="badge-label">Skill Unlocked</div>
    <div class="badge-name">Letter Tracing</div>
  </div>
  <button class="btn" id="playAgainBtn">Play Again</button>
</div>

<script>
'use strict';

// ═══ Screens ═══
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('off'));
  document.getElementById(id).classList.remove('off');
}

// ═══ Speech ═══
let cv=null;
function cacheV(){const v=speechSynthesis.getVoices();if(!v.length)return;
  const p=['samantha','karen','moira','tessa','fiona','victoria','zira','jenny','google uk english female','google us english'];
  for(const n of p){const f=v.find(x=>x.name.toLowerCase().includes(n)&&x.lang.startsWith('en'));if(f){cv=f;return;}}
  cv=v.find(x=>x.lang.startsWith('en')&&x.localService)||v.find(x=>x.lang.startsWith('en'))||v[0];}
speechSynthesis.onvoiceschanged=cacheV;cacheV();

function say(t,cb){
  if(!t){if(cb)cb();return;}
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.rate=0.85;u.pitch=1.05;u.volume=1;
    if(!cv)cacheV();if(cv)u.voice=cv;let d=false;
    function fin(){if(d)return;d=true;if(cb)cb();}
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3000,t.length*200));
    speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume();},60);
}
setInterval(()=>{if(speechSynthesis.paused)speechSynthesis.resume();},500);

// ═══ SFX ═══
let _ac;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function sfxOk(){try{const a=getAC(),n=a.currentTime;[523,659,784,1047].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.18,n+i*0.1+0.03);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.8);o.connect(g);g.connect(a.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.85);});}catch(e){}}
function sfxWin(){try{const a=getAC(),n=a.currentTime;[523,587,659,784,880,1047].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=h;g.gain.setValueAtTime(0,n+i*0.1);g.gain.linearRampToValueAtTime(0.1,n+i*0.1+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+i*0.1+0.7);o.connect(g);g.connect(a.destination);o.start(n+i*0.1);o.stop(n+i*0.1+0.8);});}catch(e){}}
document.addEventListener('pointerdown',()=>{try{getAC();}catch(e){}},{once:true});

// ═══ Letter Data ═══
const LETTERS={
  L:{strokes:[
    [{x:.3,y:.15},{x:.3,y:.25},{x:.3,y:.35},{x:.3,y:.45},{x:.3,y:.55},{x:.3,y:.65},{x:.3,y:.75},{x:.3,y:.85}],
    [{x:.3,y:.85},{x:.4,y:.85},{x:.5,y:.85},{x:.6,y:.85},{x:.7,y:.85}]
  ]},
  C:{strokes:[
    (()=>{const p=[];for(let a=0.3;a<=2.0;a+=0.1)p.push({x:.55+.28*Math.cos(a),y:.5-.32*Math.sin(a)});return p;})()
  ]},
  T:{strokes:[
    [{x:.2,y:.18},{x:.3,y:.18},{x:.4,y:.18},{x:.5,y:.18},{x:.6,y:.18},{x:.7,y:.18},{x:.8,y:.18}],
    [{x:.5,y:.18},{x:.5,y:.3},{x:.5,y:.42},{x:.5,y:.54},{x:.5,y:.66},{x:.5,y:.78},{x:.5,y:.85}]
  ]},
  A:{strokes:[
    [{x:.15,y:.85},{x:.22,y:.68},{x:.3,y:.5},{x:.38,y:.32},{x:.44,y:.18},{x:.5,y:.1}],
    [{x:.5,y:.1},{x:.56,y:.18},{x:.62,y:.32},{x:.7,y:.5},{x:.78,y:.68},{x:.85,y:.85}],
    [{x:.3,y:.55},{x:.4,y:.55},{x:.5,y:.55},{x:.6,y:.55},{x:.7,y:.55}]
  ]},
  M:{strokes:[
    [{x:.12,y:.85},{x:.12,y:.7},{x:.12,y:.55},{x:.12,y:.4},{x:.12,y:.25},{x:.12,y:.15}],
    [{x:.12,y:.15},{x:.24,y:.3},{x:.35,y:.45},{x:.5,y:.55}],
    [{x:.5,y:.55},{x:.65,y:.45},{x:.76,y:.3},{x:.88,y:.15}],
    [{x:.88,y:.15},{x:.88,y:.3},{x:.88,y:.45},{x:.88,y:.6},{x:.88,y:.75},{x:.88,y:.85}]
  ]},
  S:{strokes:[
    (()=>{const p=[];
      for(let t=0;t<=1;t+=0.06){const a=0.5+t*Math.PI;p.push({x:.5+.22*Math.cos(a),y:.3-.15*Math.sin(a)});}
      for(let t=0;t<=1;t+=0.06){const a=-0.5+t*Math.PI;p.push({x:.5-.22*Math.cos(a),y:.65+.17*Math.sin(a)});}
      return p;
    })()
  ]},
};

// ═══ Drawing ═══
function drawSoil(ctx,w,h){
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#6b4226');g.addColorStop(0.5,'#5a3820');g.addColorStop(1,'#4a2e18');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,0,w,h,16);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
  for(let i=1;i<5;i++){
    const fy=h*i/5;ctx.beginPath();ctx.moveTo(16,fy);
    ctx.bezierCurveTo(w*0.3,fy+3,w*0.7,fy-3,w-16,fy);ctx.stroke();
  }
}

function drawGuide(ctx,letter,w,h,alpha){
  const data=LETTERS[letter];if(!data)return;
  ctx.save();ctx.globalAlpha=alpha||0.45;
  ctx.setLineDash([6,8]);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#d9c08a';ctx.lineWidth=10;
  data.strokes.forEach(stroke=>{
    ctx.beginPath();
    stroke.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x*w,p.y*h);else ctx.lineTo(p.x*w,p.y*h);});
    ctx.stroke();
  });
  ctx.setLineDash([]);
  data.strokes.forEach((stroke,si)=>{
    const p=stroke[0];ctx.globalAlpha=alpha||0.7;
    ctx.fillStyle=si===0?'#7cfc00':'#ffe44d';
    ctx.beginPath();ctx.arc(p.x*w,p.y*h,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=si===0?'#fff':'#5a3e1b';
    ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(si+1,p.x*w,p.y*h);
  });
  ctx.restore();
}

function drawTrail(ctx,segments,w,h){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  segments.forEach(seg=>{
    if(seg.length<2)return;
    ctx.strokeStyle='rgba(124,252,0,0.5)';ctx.lineWidth=16;ctx.beginPath();
    seg.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x*w,p.y*h);else ctx.lineTo(p.x*w,p.y*h);});ctx.stroke();
    ctx.strokeStyle='#5aac3a';ctx.lineWidth=7;ctx.beginPath();
    seg.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x*w,p.y*h);else ctx.lineTo(p.x*w,p.y*h);});ctx.stroke();
  });
  ctx.restore();
}

function drawSprout(ctx,w,h,progress){
  const cx=w/2,by=h*0.92,p=Math.min(1,progress);if(p<=0)return;
  ctx.fillStyle='#8b6914';ctx.beginPath();ctx.ellipse(cx,by,20,8,0,0,Math.PI*2);ctx.fill();
  if(p>0.25){const sh=45*Math.min(1,(p-0.25)/0.5);
    ctx.strokeStyle='#2d8a4e';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(cx,by);ctx.quadraticCurveTo(cx+4,by-sh*0.5,cx,by-sh);ctx.stroke();}
  if(p>0.6){const lp=Math.min(1,(p-0.6)/0.4),ly=by-45;
    ctx.fillStyle='#5aac3a';ctx.beginPath();ctx.ellipse(cx-14*lp,ly+4,11*lp,6*lp,-0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a9830';ctx.beginPath();ctx.ellipse(cx+12*lp,ly,10*lp,5*lp,0.3,0,Math.PI*2);ctx.fill();}
  if(p>=1){ctx.fillStyle='#ffe44d';ctx.beginPath();ctx.arc(cx,by-54,6,0,Math.PI*2);ctx.fill();
    for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;ctx.fillStyle='#ff7675';
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*8,by-54+Math.sin(a)*8,3,0,Math.PI*2);ctx.fill();}}
}

// ═══ Trace Input ═══
function createTracer(canvas,letter,onComplete){
  const data=LETTERS[letter];if(!data)return()=>{};
  const w=canvas.width,h=canvas.height;
  const allTargets=[];data.strokes.forEach(s=>allTargets.push(...s));
  let nextIdx=0;const segments=[];let currentSeg=[];let isDrawing=false;
  const tolerance=0.10;

  function redraw(){
    const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);
    drawSoil(ctx,w,h);drawGuide(ctx,letter,w,h,0.45);
    const displaySegs=[...segments];if(currentSeg.length)displaySegs.push(currentSeg);
    drawTrail(ctx,displaySegs,w,h);
    if(nextIdx<allTargets.length){const t=allTargets[nextIdx];
      ctx.fillStyle='rgba(124,252,0,0.25)';ctx.beginPath();ctx.arc(t.x*w,t.y*h,tolerance*w,0,Math.PI*2);ctx.fill();}
    drawSprout(ctx,w,h,nextIdx/allTargets.length);
  }

  function getPos(e){const rect=canvas.getBoundingClientRect();
    return{x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height};}

  function onDown(e){e.preventDefault();isDrawing=true;currentSeg=[getPos(e)];checkProgress(currentSeg[0]);redraw();}
  function onMove(e){if(!isDrawing)return;e.preventDefault();const p=getPos(e);currentSeg.push(p);checkProgress(p);redraw();}
  function onUp(){if(!isDrawing)return;isDrawing=false;if(currentSeg.length>1)segments.push(currentSeg);currentSeg=[];redraw();}

  function checkProgress(p){
    while(nextIdx<allTargets.length){
      const t=allTargets[nextIdx],d=Math.hypot(p.x-t.x,p.y-t.y);
      if(d<tolerance){nextIdx++;
        if(nextIdx>=allTargets.length){isDrawing=false;if(currentSeg.length>1)segments.push(currentSeg);currentSeg=[];redraw();if(onComplete)onComplete();return;}
      }else break;
    }
  }

  canvas.addEventListener('pointerdown',onDown);
  canvas.addEventListener('pointermove',onMove);
  canvas.addEventListener('pointerup',onUp);
  canvas.addEventListener('pointerleave',onUp);
  redraw();
  return()=>{canvas.removeEventListener('pointerdown',onDown);canvas.removeEventListener('pointermove',onMove);
    canvas.removeEventListener('pointerup',onUp);canvas.removeEventListener('pointerleave',onUp);};
}

// ═══ Game Data ═══
const ROUNDS=[{letter:'A'},{letter:'M'},{letter:'T'},{letter:'L'}];
let rIdx=0,cleanup=null;
const traceCanvas=document.getElementById('trace-canvas');

// ═══ Game Logic ═══
function startGame(){
  try{getAC();}catch(e){}
  speechSynthesis.cancel();
  rIdx=0;showScreen('s-game');setTimeout(()=>setupRound(0),200);
}

function setupRound(idx){
  const r=ROUNDS[idx];
  if(cleanup){cleanup();cleanup=null;}

  document.getElementById('round-dots').innerHTML=ROUNDS.map((_,i)=>
    `<div class="rdot${i<idx?' done':''}${i===idx?' cur':''}"></div>`).join('');
  document.getElementById('round-label').textContent=`Round ${idx+1} of ${ROUNDS.length}`;

  const cap=document.getElementById('caption');
  cap.innerHTML=`Trace the letter <strong>${r.letter}</strong>.`;

  const ctx=traceCanvas.getContext('2d');
  ctx.clearRect(0,0,traceCanvas.width,traceCanvas.height);
  drawSoil(ctx,traceCanvas.width,traceCanvas.height);
  drawGuide(ctx,r.letter,traceCanvas.width,traceCanvas.height,0.5);

  const instruction=idx===0
    ?'Trace the letter '+r.letter.toLowerCase()+'. Follow the dotted path with your finger.'
    :'Trace the letter '+r.letter.toLowerCase()+'.';

  say(instruction,()=>{
    cleanup=createTracer(traceCanvas,r.letter,()=>{
      if(cleanup){cleanup();cleanup=null;}
      sfxOk();
      cap.innerHTML=`You traced <strong>${r.letter}</strong>!`;
      say('You traced '+r.letter.toLowerCase()+'!',()=>{
        setTimeout(advanceRound,600);
      });
    });
  });
}

function advanceRound(){
  rIdx++;
  if(rIdx>=ROUNDS.length){sfxWin();showScreen('s-win');burstWin();}
  else setupRound(rIdx);
}

// ═══ Win Particles ═══
function burstWin(){
  const c=document.createElement('canvas');
  c.width=innerWidth;c.height=innerHeight;
  c.style.cssText='position:fixed;top:0;left:0;z-index:99;pointer-events:none';
  document.body.appendChild(c);const cx=c.getContext('2d');const parts=[];
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+2;
    parts.push({x:c.width/2,y:c.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,
      r:Math.random()*4+2,color:`hsl(${Math.random()*360},80%,60%)`,alpha:1});}
  (function loop(){cx.clearRect(0,0,c.width,c.height);let alive=false;
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.alpha-=0.015;
      if(p.alpha>0){alive=true;cx.globalAlpha=p.alpha;cx.fillStyle=p.color;
        cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();}});
    cx.globalAlpha=1;if(alive)requestAnimationFrame(loop);else c.remove();})();
}

// ═══ Buttons ═══
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('playAgainBtn').addEventListener('click',startGame);
</script>
</body>
</html>
