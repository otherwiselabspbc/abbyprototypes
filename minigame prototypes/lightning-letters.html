<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lightning Letters — Letter Naming Fluency</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Nunito',sans-serif;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;height:100vh;width:100vw;background:#0d0a1a;color:#e8dcc8;
  cursor:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><text y='18' font-size='18'>✦</text></svg>") 4 4,auto}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;z-index:10;background:radial-gradient(ellipse at 50% 40%,#1a1630 0%,#141820 50%,#0d0a1a 100%)}
.screen.off{display:none!important}

/* Landing */
.title{font-family:'Cinzel',serif;font-size:clamp(30px,8vw,52px);font-weight:900;color:#fff;
  text-align:center;text-shadow:0 0 30px rgba(100,200,255,.3),0 4px 0 rgba(0,0,0,.3);margin-bottom:8px}
.skill-tag{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:rgba(120,220,255,.6);margin-bottom:36px}
.btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:#fff;border:none;
  border-radius:14px;padding:18px 52px;cursor:pointer;text-transform:uppercase;letter-spacing:3px;
  background:linear-gradient(180deg,#2ec4b6,#1a9e8f);box-shadow:0 4px 0 #14776d,0 0 30px rgba(46,196,182,.3);
  transition:transform .1s;-webkit-tap-highlight-color:transparent;
  animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #14776d,0 0 30px rgba(46,196,182,.3)}
  50%{box-shadow:0 4px 0 #14776d,0 0 60px rgba(46,196,182,.6),0 0 90px rgba(46,196,182,.2)}}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #14776d}

/* HUD */
#hud{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px}
#dots{display:flex;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:#1e1b2e;border:2px solid #3a3660;transition:.3s}
.dot.done{background:#2ec4b6;border-color:#1a9e8f;box-shadow:0 0 8px rgba(46,196,182,.5)}
.dot.cur{background:#f0c040;border-color:#c89e30;box-shadow:0 0 10px rgba(240,192,64,.5)}
#round-label{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5)}

/* Grid */
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:360px;width:90%}
.tile{background:#1a1730;border:3px solid #2ec4b6;border-radius:16px;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;
  font-size:clamp(32px,8vw,48px);font-weight:900;color:#e8dcc8;cursor:pointer;
  transition:border-color .15s,transform .1s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.tile:hover{border-color:#5eeadb;transform:translateY(-2px)}
.tile:active{transform:translateY(1px)}
.tile.correct{border-color:#5ec77a;background:#1a2e1a;box-shadow:0 0 24px rgba(94,199,122,.5);color:#5ec77a}
.tile.wrong{animation:shake .4s}
.tile.reveal{border-color:#f0c040;box-shadow:0 0 20px rgba(240,192,64,.4);color:#f0c040}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Win */
.win-title{font-family:'Cinzel',serif;font-size:clamp(28px,7vw,46px);font-weight:900;color:#fff;
  text-shadow:0 0 30px rgba(100,200,255,.3);margin-bottom:8px}
.badge{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:#2ec4b6;margin-bottom:32px}

/* Sparkle canvas */
#sparkles{position:fixed;inset:0;pointer-events:none;z-index:99}
</style>
</head>
<body>
<canvas id="sparkles"></canvas>

<!-- Landing -->
<div class="screen" id="s-land">
  <div class="title">Lightning Letters</div>
  <div class="skill-tag">Letter Naming Fluency</div>
  <button class="btn" id="btn-begin">Begin</button>
</div>

<!-- Game -->
<div class="screen off" id="s-game">
  <div id="hud"><div id="dots"></div><div id="round-label"></div></div>
  <div id="grid"></div>
</div>

<!-- Win -->
<div class="screen off" id="s-win">
  <div class="win-title">Well Done!</div>
  <div class="badge">Letter Naming Fluency</div>
  <button class="btn" id="btn-again">Play Again</button>
</div>

<script>
const ROUNDS=[
  {target:'B',grid:['B','D','P','R','M','K']},
  {target:'G',grid:['G','C','Q','O','S','J']},
  {target:'N',grid:['N','M','W','H','V','U']},
  {target:'E',grid:['E','F','L','I','T','A']},
  {target:'W',grid:['W','V','M','N','U','X']},
  {target:'J',grid:['J','I','L','T','G','Y']}
];
let round=0,mistakes=0,locked=false,voice=null;
const $=id=>document.getElementById(id);
const show=s=>{document.querySelectorAll('.screen').forEach(e=>e.classList.add('off'));$(s).classList.remove('off')};

/* --- Voice --- */
function pickVoice(){
  const v=speechSynthesis.getVoices();
  const prefs=['samantha','karen','moira','fiona','victoria','alex'];
  for(const p of prefs){const f=v.find(x=>x.name.toLowerCase().includes(p));if(f)return f}
  return v.find(x=>x.lang.startsWith('en'))||v[0]||null;
}
function speak(text,cb){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice)u.voice=voice;u.rate=0.9;u.pitch=1.05;
  if(cb)u.onend=cb;speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged=()=>{voice=pickVoice()};
voice=pickVoice();

/* --- Audio --- */
const ctx=new(window.AudioContext||window.webkitAudioContext)();
function chime(){
  [0,.12,.24].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.value=[523,659,784][i];
    g.gain.setValueAtTime(.18,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.3);
    o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.35)})
}
function wrongTone(){
  [0,.1].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=[330,262][i];
    g.gain.setValueAtTime(.12,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.25);
    o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.3)})
}
function winArpeggio(){
  [523,659,784,1047,1319].forEach((f,i)=>{const d=i*.15;
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.15,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.5);
    o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.55)})
}

/* --- Sparkle trail --- */
const sc=$('sparkles'),sx=sc.getContext('2d');let sparks=[];
function resizeCanvas(){sc.width=innerWidth;sc.height=innerHeight}
resizeCanvas();addEventListener('resize',resizeCanvas);
addEventListener('pointermove',e=>{for(let i=0;i<2;i++)sparks.push({x:e.clientX,y:e.clientY,
  vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2-1,life:1,size:Math.random()*3+1})});
function animSparks(){sx.clearRect(0,0,sc.width,sc.height);
  sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.life-=.03;if(s.life<=0)return false;
    sx.globalAlpha=s.life;sx.fillStyle='#5eeadb';sx.beginPath();
    sx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2);sx.fill();return true});
  requestAnimationFrame(animSparks)}
animSparks();

/* --- Shuffle --- */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]]}return b}

/* --- HUD --- */
function updateHUD(){
  $('dots').innerHTML=ROUNDS.map((_,i)=>`<div class="dot${i<round?' done':''}${i===round?' cur':''}"></div>`).join('');
  $('round-label').textContent=`Round ${round+1} of ${ROUNDS.length}`;
}

/* --- Round --- */
function startRound(){
  locked=false;mistakes=0;updateHUD();
  const r=ROUNDS[round],tiles=shuffle(r.grid);
  $('grid').innerHTML=tiles.map(l=>`<div class="tile" data-letter="${l}">${l}</div>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>handleTap(t)));
  const intro=round===0?'Listen to the letter name, then tap it as fast as you can! ':'';
  speak(intro+`Find ${r.target.toLowerCase()}!`);
}

function handleTap(t){
  if(locked)return;
  const letter=t.dataset.letter,target=ROUNDS[round].target;
  if(letter===target){
    locked=true;t.classList.add('correct');chime();
    setTimeout(()=>{round++;round<ROUNDS.length?startRound():(show('s-win'),winArpeggio())},800);
  }else{
    mistakes++;wrongTone();t.classList.add('wrong');t.style.pointerEvents='none';
    speak(`That's ${letter.toLowerCase()}. Find ${target.toLowerCase()}!`);
    if(mistakes>=2){locked=true;
      const ans=document.querySelector(`.tile[data-letter="${target}"]`);
      ans.classList.add('reveal');speak(`That's ${target.toLowerCase()}.`,()=>{
        setTimeout(()=>{round++;round<ROUNDS.length?startRound():(show('s-win'),winArpeggio())},800)});
    }
  }
}

/* --- Start / Restart --- */
$('btn-begin').addEventListener('click',()=>{ctx.resume();show('s-game');round=0;startRound()});
$('btn-again').addEventListener('click',()=>{show('s-game');round=0;startRound()});
</script>
</body>
</html>
